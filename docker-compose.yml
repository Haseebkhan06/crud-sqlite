services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tasksdb
    ports:
      - "5432:5432"
    volumes:
      - flyrank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrank -d tasksdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://flyrank:${POSTGRES_PASSWORD}@db:5432/tasksdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  flyrank_pgdata:
    external: true